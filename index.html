<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abyssal Animals — Deep-Sea Creature Catalog</title>

  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>


  <header class="site-header">
    <div class="header-glow"></div>
    <div class="bubbles" aria-hidden="true">
      <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
      <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
      <span class="bubble"></span><span class="bubble"></span>
    </div>
    <div class="container text-center position-relative">
      <p class="site-eyebrow">Hadal Exploration </p>
      <h1 class="site-title">Abyssal<br>Animals</h1>
      <p class="site-tagline">A field guide to creatures of the permanent dark made by capi</p>


      <div class="filter-bar" role="toolbar" aria-label="Filter by category">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Predator">Predator</button>
        <button class="filter-btn" data-filter="Cephalopod">Cephalopod</button>
        <button class="filter-btn" data-filter="Crustacean">Crustacean</button>
        <button class="filter-btn" data-filter="Gelatinous">Gelatinous</button>
        <button class="filter-btn" data-filter="Fish">Fish</button>
        <button class="filter-btn" data-filter="Colonial Organism">Colonial</button>
      </div>
    </div>
  </header>


  <main class="container catalog-container">
    <div id="creatureGrid" class="row g-4">
  
    </div>

  
    <div id="loadingState" class="loading-state text-center" aria-live="polite">
      <div class="pulse-orb"></div>
      <p>Scanning the abyss…</p>
    </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
